name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Cache wake-word model
        uses: actions/cache@v4
        with:
          path: mobile/modules/chief-companion/android/src/main/assets/vosk-model
          key: vosk-model-small-en-us-0.15

      - name: Fetch wake-word model (open source, Apache 2.0)
        run: |
          DIR=modules/chief-companion/android/src/main/assets/vosk-model
          if [ ! -f "$DIR/am/final.mdl" ]; then
            curl -fsSL -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            unzip -q /tmp/vosk.zip -d /tmp/vosk
            mkdir -p "$(dirname "$DIR")"
            rm -rf "$DIR"
            mv /tmp/vosk/vosk-model-small-en-us-0.15 "$DIR"
          fi
          ls "$DIR"

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/chief-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chief build ${{ github.run_number }}
          body: |
            Download the .apk below on your Android phone and open it to install.
            Commit: ${{ github.sha }}
          files: dist/chief-${{ github.run_number }}.apk
          make_latest: true
