name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # The wake-word model is not bundled (keeps the APK ~45 MB). The app downloads it once
      # from this release; make sure the release exists.
      - name: Publish wake-word model (open source, Apache 2.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view vosk-model --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            curl -fsSL -o /tmp/vosk-model-small-en-us-0.15.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
            gh release create vosk-model /tmp/vosk-model-small-en-us-0.15.zip --repo "$GITHUB_REPOSITORY" \
              --title "Wake word model (Vosk small en-US 0.15)" --notes "Downloaded by the app on first use. Apache 2.0, alphacephei.com/vosk." \
              --prerelease --latest=false
          fi

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/chief-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chief build ${{ github.run_number }}
          body: |
            Download the .apk below on your Android phone and open it to install.
            Commit: ${{ github.sha }}
          files: dist/chief-${{ github.run_number }}.apk
          make_latest: true
